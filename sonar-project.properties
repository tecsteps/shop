sonar.sources=.
sonar.tests=tests
sonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**
sonar.test.exclusions=vendor/**,node_modules/**

# Suppress S5332 (clear-text protocol) in test files - http:// URLs are intentional test fixtures
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**
